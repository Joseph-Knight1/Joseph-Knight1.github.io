  <button id="play">Pause</button>
  <label>Speed <input id="speed" type="range" min="10" max="360" value="90" style="min-width:120px"></label>

</main>

<script>
// ============================ CONFIG ============================
// Everything here is an element id from your Inkscape drawing.
const CONFIG = {
  // Marker shapes (any small circle/rect) placed in the drawing in its REFERENCE pose (theta = 0):
  axis:  'axis',    // centre of the crankshaft / flywheel
  pin:   'pin0',    // centre of the crank pin
  wrist: 'wrist0',  // centre of the piston (gudgeon / wrist) pin

  // Moving groups
  piston: 'piston',                 // translates along the cylinder
  rod:    'rod',                    // connecting rod: ONE group, drawn in the reference pose
  rotating: [                       // groups that spin about the axis
    { id: 'flywheel', ratio: 1 },   // ratio = speed relative to crank; negative = opposite direction
    { id: 'crank',    ratio: 1 },
    // { id: 'gear2', ratio: -2, pivot: 'gear2centre' },  // other pivots need their own marker id
  ],

  direction: 1,     // 1 = theta increases clockwise on screen, -1 = anticlockwise
  slide: null       // piston travel direction as [dx, dy], e.g. [1,0]; null = auto (nearest axis from crank to wrist pin)
};
// ================================================================

const svg = document.querySelector('#stagewrap svg');
const $ = id => svg.querySelector('#' + CSS.escape(id));
const need = id => { const e = $(id); if (!e) throw new Error('No element with id "' + id + '" in the SVG'); return e; };

const pistonEl = need(CONFIG.piston), rodEl = need(CONFIG.rod);
const rotEls = CONFIG.rotating.map(r => ({ ...r, el: $(r.id) })).filter(r => {
  if (!r.el) console.warn('Rotating group "' + r.id + '" not found, skipped'); return !!r.el;
});

// All coordinates are measured in the parent space of the piston group,
// so moving groups should share a parent (same Inkscape layer).
const frame = pistonEl.parentNode;
const centre = el => {
  const b = el.getBBox();
  const m = frame.getScreenCTM().inverse().multiply(el.getScreenCTM());
  const p = new DOMPoint(b.x + b.width / 2, b.y + b.height / 2).matrixTransform(m);
  return { x: p.x, y: p.y };
};

const C = centre(need(CONFIG.axis)), P0 = centre(need(CONFIG.pin)), W0 = centre(need(CONFIG.wrist));
const pivots = {};
rotEls.forEach(r => { pivots[r.id] = r.pivot ? centre(need(r.pivot)) : C; });

// Hide markers (after measuring)
[CONFIG.axis, CONFIG.pin, CONFIG.wrist, ...rotEls.map(r => r.pivot).filter(Boolean)]
  .forEach(id => { const e = $(id); if (e) e.style.display = 'none'; });

// Derived geometry
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const R = dist(C, P0), L = dist(P0, W0);
const a0 = Math.atan2(P0.y - C.y, P0.x - C.x);
const rod0 = Math.atan2(W0.y - P0.y, W0.x - P0.x);
const dir = CONFIG.direction;
let d;
if (CONFIG.slide) { const n = Math.hypot(...CONFIG.slide); d = { x: CONFIG.slide[0] / n, y: CONFIG.slide[1] / n }; }
else {
  const dx = W0.x - C.x, dy = W0.y - C.y;
  d = Math.abs(dx) >= Math.abs(dy) ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) };
}

// Slider-crank solution for a given theta (radians)
function solve(th) {
  const a = a0 + dir * th;
  const P = { x: C.x + R * Math.cos(a), y: C.y + R * Math.sin(a) };
  const A = { x: P.x - W0.x, y: P.y - W0.y };
  const b = A.x * d.x + A.y * d.y;
  const s = Math.sqrt(Math.max(b * b - (A.x * A.x + A.y * A.y) + L * L, 0));
  return { P, b, s };
}
const s0 = solve(0);
const branch = Math.abs(s0.b + s0.s) < Math.abs(s0.b - s0.s) ? 1 : -1;  // keep the root that is 0 at theta = 0

// Preserve any transform Inkscape already put on each group
const base = new Map();
[pistonEl, rodEl, ...rotEls.map(r => r.el)].forEach(e => base.set(e, e.getAttribute('transform') || ''));
const setT = (e, t) => e.setAttribute('transform', (t + ' ' + base.get(e)).trim());

let current = 0;
function setTheta(deg) {
  deg = ((deg % 360) + 360) % 360;
  const th = deg * Math.PI / 180;
  const { P, b, s } = solve(th);
  const t = b + branch * s;                              // piston travel from its reference position
  const W = { x: W0.x + t * d.x, y: W0.y + t * d.y };

  setT(pistonEl, `translate(${t * d.x} ${t * d.y})`);
  const dRod = (Math.atan2(W.y - P.y, W.x - P.x) - rod0) * 180 / Math.PI;
  setT(rodEl, `translate(${P.x - P0.x} ${P.y - P0.y}) rotate(${dRod} ${P0.x} ${P0.y})`);
  rotEls.forEach(r => {
    const c = pivots[r.id];
    setT(r.el, `rotate(${dir * deg * r.ratio} ${c.x} ${c.y})`);
  });

  current = deg;
}
window.setTheta = setTheta;   // for headless frame rendering (Playwright etc.)

// Controls
const playBtn = document.getElementById('play');
let playing = true, last = null;
const stop = () => { playing = false; playBtn.textContent = 'Play'; };
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; };

(function loop(t) {
  if (playing && last !== null) setTheta(current + document.getElementById('speed').value * (t - last) / 1000);
  last = t; requestAnimationFrame(loop);
})(0);

const q = new URLSearchParams(location.search).get('theta');
if (q !== null) { stop(); setTheta(+q); } else setTheta(0);
</script>
